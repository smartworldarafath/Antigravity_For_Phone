name: Build and Release Antigravity APKs

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'
      draft:
        description: 'Create Draft Release'
        type: boolean
        default: false
      prerelease:
        description: 'Mark as Pre-release'
        type: boolean
        default: false
      vendor_url:
        description: 'Optional direct URL to download vendor inputs archive (core, glibc, certs, seed, shims)'
        required: false

permissions:
  contents: write

jobs:
  build:
    name: Build Both Release Editions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Setup Java JDK (Java 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Android Build Tools & System Utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y aapt zipalign apksigner file zip unzip gzip

      - name: Prepare Vendor Inputs & Signing Keystore
        env:
          VENDOR_URL: ${{ inputs.vendor_url || secrets.VENDOR_DOWNLOAD_URL }}
        run: |
          mkdir -p tools
          
          # 1. Generate debug keystore if absent
          if [ ! -f "tools/debug.keystore" ]; then
            echo "[CI] Generating debug keystore..."
            keytool -genkey -v -keystore tools/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # 2. Setup Android API 28 android.jar if absent
          if [ ! -f "tools/android.jar" ]; then
            echo "[CI] Fetching android.jar (API 28)..."
            curl -fsSL -o tools/android.jar "https://github.com/Sable/android-platforms/raw/master/android-28/android.jar" || \
            curl -fsSL -o tools/android.jar "https://raw.githubusercontent.com/iBotPeaches/platform_frameworks_base/master/android-28.jar"
          fi

          # 3. Setup R8 / D8 compiler jar if absent
          if [ ! -f "tools/r8.jar" ]; then
            echo "[CI] Fetching r8.jar..."
            curl -fsSL -o tools/r8.jar "https://dl.google.com/dl/android/maven2/com/android/tools/r8/8.2.42/r8-8.2.42.jar"
          fi

          # 4. Handle optional external vendor archive override
          if [ -n "$VENDOR_URL" ]; then
            echo "[CI] Downloading vendor inputs from $VENDOR_URL..."
            mkdir -p vendor
            curl -fsSL -o vendor.tar.gz "$VENDOR_URL"
            tar -xzf vendor.tar.gz -C vendor
            export AGY_HOME="$PWD/vendor"
          fi

      - name: Build Both Release Editions (dist/antigravity.apk & dist/antigravity-region-bypass.apk)
        run: |
          python3 build.py --all

      - name: Display Checksums
        run: |
          cat dist/SHA256SUMS.txt

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: antigravity-binaries
          path: |
            dist/antigravity.apk
            dist/antigravity-region-bypass.apk
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: ${{ format('Antigravity for Android {0}', github.event.inputs.tag_name || github.ref_name) }}
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          make_latest: true
          files: |
            dist/antigravity.apk
            dist/antigravity-region-bypass.apk
            dist/SHA256SUMS.txt
          body: |
            <div align="center">
              <h3>Antigravity for Android v1.0.0</h3>
              <p>Autonomous AI Coding Environment &bull; Native Bionic Userspace &bull; ARM64</p>
            </div>

            ---

            ### Packages & Artifacts

            | Package | Description |
            | :--- | :--- |
            | **`antigravity.apk`** | Standard production release with native bionic engine (com.agy, port 45157) |
            | **`antigravity-region-bypass.apk`** | Region bypass edition with account eligibility check bypass (com.agy, port 45157) |
            | **`SHA256SUMS.txt`** | Cryptographic checksums for package integrity verification |

            ---

            ### Key Highlights in v1.0.0

            * **High Refresh Rate Support (120Hz & 144Hz):** Fully optimized display mode switching for 120Hz, 144Hz, and 165Hz high-refresh displays with dynamic resolution matching and preferred display rate scaling.
            * **Butter Smooth 60fps+ Animations & Transitions:** All UI transitions, dialogs, drawers, and buttons upgraded with spring-eased micro-interactions (`cubic-bezier(0.16, 1, 0.3, 1)`), smooth popup scaling, and GPU layer acceleration (`transform: translateZ(0)`).
            * **Thermal Management & Battery Efficiency:** Replaced continuous 1-second CPU polling loops with an event-driven state change architecture. Smart wakelock management prevents unnecessary CPU wakeups, completely eliminating standby battery drain and device heating.
            * **Cross-Platform APK Builder (`build.py`):** Unified single-command APK builder supporting Windows, Linux, and macOS without requiring Gradle.
            * **Backend & App Versioning:** Version aligned to v1.0.0 (versionCode 100).
            * **All Native Core Features Intact:** Built-in web terminal & PTY shell, Shizuku ADB bridge, Termux package manager, OAuth flows, and background micro-daemon remain 100% functional.
